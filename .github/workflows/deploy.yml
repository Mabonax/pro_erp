name: Production release

on:
  workflow_dispatch:
    inputs:
      erp_ref:
        description: ERP branch, tag, or commit to package
        required: true
        default: program-of-action-erp
        type: string
      website_ref:
        description: Public website branch, tag, or commit to package
        required: true
        default: main
        type: string
      allow_merge_commit:
        description: Allow packaging a merge commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: poa-production-release
  cancel-in-progress: false

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  ERP_URL: https://erp.programofaction.org
  WEBSITE_URL: https://programofaction.org
  WEBSITE_REPOSITORY: Mabonax/poa_blog-

jobs:
  build-erp:
    name: Build, test, and package ERP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Checkout ERP
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.erp_ref }}
          path: erp
          persist-credentials: false

      - name: Resolve ERP revision
        id: revision
        working-directory: erp
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse merge commit unless approved
        if: ${{ ! inputs.allow_merge_commit }}
        working-directory: erp
        run: |
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$parents" -gt 2 ]; then
            echo "::error::ERP target is a merge commit. Re-run with allow_merge_commit=true only after review."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: erp/package-lock.json

      - name: Install PHP dependencies
        working-directory: erp
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: erp
        run: npm ci

      - name: Prepare test environment
        working-directory: erp
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache
          touch database/database.sqlite
          {
            echo "APP_ENV=testing"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/erp/database/database.sqlite"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=array"
            echo "MAIL_MAILER=log"
            echo "CITIZEN_ACCESS_PUBLIC_INTAKE_TOKEN=test-token"
          } >> .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Run ERP frontend checks
        working-directory: erp
        run: |
          npm run build
          npm run types
          test -f public/build/manifest.json

      - name: Run ERP tests
        working-directory: erp
        run: php artisan test

      - name: Package ERP release archive
        id: package
        working-directory: erp
        run: |
          set -Eeuo pipefail
          archive="poa-erp-${{ steps.revision.outputs.sha }}.tar.gz"
          staging="$RUNNER_TEMP/erp-package"
          rm -rf "$staging"
          mkdir -p "$staging"
          rsync -a ./ "$staging/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='.tmp_*' \
            --exclude='*.log'
          test -f "$staging/public/build/manifest.json"
          tar -C "$staging" -czf "$RUNNER_TEMP/$archive" .
          sha256sum "$RUNNER_TEMP/$archive" | tee "$RUNNER_TEMP/$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d' ' -f1 "$RUNNER_TEMP/$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload ERP release package
        uses: actions/upload-artifact@v4
        with:
          name: erp-release-package
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  build-website:
    name: Build, test, and package public website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Checkout public website
        uses: actions/checkout@v5
        with:
          repository: ${{ env.WEBSITE_REPOSITORY }}
          ref: ${{ inputs.website_ref }}
          path: website
          token: ${{ secrets.POA_WEBSITE_REPOSITORY_TOKEN || github.token }}
          persist-credentials: false

      - name: Resolve website revision
        id: revision
        working-directory: website
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse merge commit unless approved
        if: ${{ ! inputs.allow_merge_commit }}
        working-directory: website
        run: |
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$parents" -gt 2 ]; then
            echo "::error::Website target is a merge commit. Re-run with allow_merge_commit=true only after review."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install PHP dependencies
        working-directory: website
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: website
        run: npm ci

      - name: Prepare test environment
        working-directory: website
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache config
          touch database/database.sqlite
          {
            echo "APP_ENV=testing"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/website/database/database.sqlite"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=array"
            echo "MAIL_MAILER=log"
          } >> .env
          php artisan key:generate --force
          php artisan config:clear
          cat > config/inertia.php <<'PHP'
          <?php

          return [
              'testing' => [
                  'ensure_pages_exist' => true,
                  'page_paths' => [
                      resource_path('js/pages'),
                  ],
                  'page_extensions' => [
                      'js',
                      'jsx',
                      'svelte',
                      'ts',
                      'tsx',
                      'vue',
                  ],
              ],
          ];
          PHP

      - name: Run website frontend checks
        working-directory: website
        run: |
          npm run build
          test -f public/build/manifest.json

      - name: Run website tests
        working-directory: website
        run: php artisan test

      - name: Package website release archive
        id: package
        working-directory: website
        run: |
          set -Eeuo pipefail
          archive="poa-website-${{ steps.revision.outputs.sha }}.tar.gz"
          staging="$RUNNER_TEMP/website-package"
          rm -rf "$staging"
          mkdir -p "$staging"
          rsync -a ./ "$staging/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='.tmp_*' \
            --exclude='*.log'
          test -f "$staging/public/build/manifest.json"
          tar -C "$staging" -czf "$RUNNER_TEMP/$archive" .
          sha256sum "$RUNNER_TEMP/$archive" | tee "$RUNNER_TEMP/$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d' ' -f1 "$RUNNER_TEMP/$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload website release package
        uses: actions/upload-artifact@v4
        with:
          name: website-release-package
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish approved pull release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-erp
      - build-website
    environment:
      name: production
      url: https://programofaction.org
    permissions:
      contents: write
    env:
      ERP_SHA: ${{ needs.build-erp.outputs.sha }}
      WEBSITE_SHA: ${{ needs.build-website.outputs.sha }}
      ERP_ARCHIVE: ${{ needs.build-erp.outputs.archive }}
      WEBSITE_ARCHIVE: ${{ needs.build-website.outputs.archive }}
      ERP_CHECKSUM: ${{ needs.build-erp.outputs.checksum }}
      WEBSITE_CHECKSUM: ${{ needs.build-website.outputs.checksum }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download ERP release package
        uses: actions/download-artifact@v5
        with:
          name: erp-release-package
          path: release-assets

      - name: Download website release package
        uses: actions/download-artifact@v5
        with:
          name: website-release-package
          path: release-assets

      - name: Create release manifest
        id: manifest
        run: |
          set -Eeuo pipefail
          release_id="$(date -u +'%Y%m%dT%H%M%SZ')-${GITHUB_RUN_ID}"
          tag="poa-production-${release_id}"
          manifest="poa-production-${release_id}-manifest.json"
          checksums="poa-production-${release_id}-checksums.txt"
          cat > "release-assets/$manifest" <<JSON
          {
            "schema_version": 1,
            "release_id": "$release_id",
            "created_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "github_run_id": "$GITHUB_RUN_ID",
            "github_repository": "$GITHUB_REPOSITORY",
            "erp": {
              "repository": "Mabonax/pro_erp",
              "commit_sha": "$ERP_SHA",
              "archive": "$ERP_ARCHIVE",
              "sha256": "$ERP_CHECKSUM",
              "health_urls": [
                "$ERP_URL",
                "$ERP_URL/api/public/v1/offerings"
              ]
            },
            "website": {
              "repository": "$WEBSITE_REPOSITORY",
              "commit_sha": "$WEBSITE_SHA",
              "archive": "$WEBSITE_ARCHIVE",
              "sha256": "$WEBSITE_CHECKSUM",
              "health_urls": [
                "$WEBSITE_URL",
                "$WEBSITE_URL/get-assistance",
                "$WEBSITE_URL/get-assistance?offering=nsfas-applications-2027"
              ]
            },
            "deployment_order": [
              "erp",
              "website"
            ]
          }
          JSON
          sha256sum "release-assets/$ERP_ARCHIVE" "release-assets/$WEBSITE_ARCHIVE" "release-assets/$manifest" > "release-assets/$checksums"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        run: |
          set -Eeuo pipefail
          cd release-assets
          test -f "$ERP_ARCHIVE"
          test -f "$ERP_ARCHIVE.sha256"
          test -f "$WEBSITE_ARCHIVE"
          test -f "$WEBSITE_ARCHIVE.sha256"
          sha256sum -c "$ERP_ARCHIVE.sha256"
          sha256sum -c "$WEBSITE_ARCHIVE.sha256"
          python -m json.tool "${{ steps.manifest.outputs.manifest }}" >/dev/null

      - name: Publish private GitHub release
        run: |
          set -Eeuo pipefail
          cat > release-notes.md <<'MD'
          Approved pull-based Program of Action production release.

          Afrihost must pull this release over authenticated HTTPS from the private ERP repository. GitHub Actions does not SSH into production.
          MD
          gh release create "${{ steps.manifest.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$ERP_SHA" \
            --title "Program of Action production ${{ steps.manifest.outputs.release_id }}" \
            --notes-file release-notes.md \
            --latest \
            "release-assets/$ERP_ARCHIVE" \
            "release-assets/$ERP_ARCHIVE.sha256" \
            "release-assets/$WEBSITE_ARCHIVE" \
            "release-assets/$WEBSITE_ARCHIVE.sha256" \
            "release-assets/${{ steps.manifest.outputs.manifest }}" \
            "release-assets/${{ steps.manifest.outputs.checksums }}"

      - name: Release summary
        run: |
          {
            echo "## Program of Action pull release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release ID | \`${{ steps.manifest.outputs.release_id }}\` |"
            echo "| Release tag | \`${{ steps.manifest.outputs.tag }}\` |"
            echo "| ERP commit | \`$ERP_SHA\` |"
            echo "| Website commit | \`$WEBSITE_SHA\` |"
            echo "| Manifest | \`${{ steps.manifest.outputs.manifest }}\` |"
            echo
            echo "GitHub published an approved private release only. Afrihost must pull and deploy it from cron."
          } >> "$GITHUB_STEP_SUMMARY"
